name: CI

on:
  push:
    # Wave branches too, not just main. Each wave is committed to a branch and gated on CI
    # before it merges; without this the first CI signal for a wave arrives after it lands,
    # which is exactly when it is most expensive to find out.
    branches: [main, 'claude/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Fetch references
        run: ./scripts/fetch-references.sh

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Unicode tables are current
        # The tables are generated from the host's Unicode data and checked in. A diff here means
        # the runner's Unicode version and the committed table disagree, which would make document
        # validity depend on where the code runs — the exact thing checking them in prevents.
        run: |
          npm run gen:unicode
          git diff --exit-code -- packages/tson/src/unicode/xid.ts

      - name: Test
        run: npm test

      - name: Conformance tests
        run: npm run test:conformance
        continue-on-error: true

      - name: Build
        run: npm run build
