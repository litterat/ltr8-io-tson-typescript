name: CI

on:
  push:
    # Wave branches too, not just main. Each wave is committed to a branch and gated on CI
    # before it merges; without this the first CI signal for a wave arrives after it lands,
    # which is exactly when it is most expensive to find out.
    branches: [main, 'claude/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Fetch references
        run: ./scripts/fetch-references.sh

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Unicode tables
        # Verifies the committed tables without letting the runner decide what they contain.
        # Regenerating and demanding a clean diff would reintroduce the host dependence the
        # tables exist to remove: GitHub's Node 24 carries Unicode 17.0 while other Node 24
        # builds carry 16.0, so node-version: 24 pins the runtime but not the character data.
        run: npm run check:unicode

      - name: Test
        run: npm test

      - name: Conformance tests
        run: npm run test:conformance
        continue-on-error: true

      - name: Build
        run: npm run build
