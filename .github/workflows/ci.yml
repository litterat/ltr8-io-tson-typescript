name: CI

on:
  push:
    # Wave branches too, not just main. Each wave is committed to a branch and gated on CI
    # before it merges; without this the first CI signal for a wave arrives after it lands,
    # which is exactly when it is most expensive to find out.
    branches: [main, 'claude/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Fetch references
        run: ./scripts/fetch-references.sh

      - name: Install dependencies
        # ci, not install. `npm install` rewrites the lockfile it is handed, and on this runner's
        # platform it rewrites it wrongly: linux-x64 takes unrs-resolver's native binding, so npm
        # drops the hoisted @emnapi entries the wasm fallback's peers need everywhere else. A
        # green run here was hiding a lockfile no other platform could install from.
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Lockfile integrity
        # Platform-independent, unlike `npm ci` itself: it reads the lockfile rather than
        # installing from it, so it sees the optional bindings this runner never fetches.
        run: npm run check:lockfile

      - name: Unicode tables
        # Verifies the committed tables without letting the runner decide what they contain.
        # Regenerating and demanding a clean diff would reintroduce the host dependence the
        # tables exist to remove: GitHub's Node 24 carries Unicode 17.0 while other Node 24
        # builds carry 16.0, so node-version: 24 pins the runtime but not the character data.
        run: npm run check:unicode

      - name: Test
        run: npm test

      - name: Conformance tests
        # Not continue-on-error. It was, while the port was mid-flight and the suite was expected
        # to be red -- but every vector at the pinned suite commit passes now, and a green suite
        # behind continue-on-error is a suite that can go red without anyone finding out.
        run: npm run test:conformance

      - name: Build
        run: npm run build

      - name: Package
        # What a consumer sees, which nothing before this step checks: publint reads the published
        # `exports`/`files`/`bin` for the mistakes that only show up after `npm publish`, and
        # arethetypeswrong resolves every subpath the way a real TypeScript consumer does, from
        # both CJS and ESM. The `node16` profile is the whole check -- `node10` predates `exports`
        # entirely and this package targets Node 24+.
        #
        # `./source` is checked on its own with `no-resolution` ignored, because not resolving is
        # what that subpath is for: it offers only the `node` condition, so a bundler *must* fail
        # to reach it (`browser-bundle.test.ts` asserts the same property from the other side).
        # Ignoring the rule for the whole package would hide a genuinely broken subpath, so the
        # other seven are checked strictly.
        #
        # attw is not run against @ltr8/tson-cli: it is a `bin`-only package with no `exports`,
        # `main` or `types`, so there is no entry point for a consumer to import and nothing for
        # attw to resolve. publint checks what that package actually publishes -- its `bin`.
        run: npm run check:package

      - name: Smoke test the published CLI
        # The one check that runs the binary the way a consumer gets it: packed, installed, and
        # invoked through `node_modules/.bin/tson`, which npm creates as a symlink. Every unit test
        # calls `main(argv)` in-process, and running `dist/cli.js` by its own path is the single
        # invocation where `process.argv[1]` matches the resolved `import.meta.url` -- so nothing
        # here could see that through the symlink it does not, and the installed CLI was a silent
        # no-op that exited 0 for every command, `validate` included.
        run: npm run smoke:cli

      - name: Build the browser demo
        # Also a check, not only an artifact: the demo bundles at `platform: 'browser'`, where
        # `@ltr8/tson/source` cannot be resolved at all and esbuild refuses a Node built-in rather
        # than shimming one. A build that succeeds is a build carrying neither.
        run: npm run demo:web
